# Use this when connecting to external/self-hosted PostgreSQL and Redis
# Run with: docker-compose -f docker-compose.external.yml up -d

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muslimfy-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
