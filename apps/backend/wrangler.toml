name = "muslimfy-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put <NAME>`)
# DATABASE_URL = "postgresql://..."
# UPSTASH_REDIS_URL = "https://..."
# UPSTASH_REDIS_TOKEN = "..."
# JWT_SECRET = "..."

# Production settings
[env.production]
name = "muslimfy-api"

[env.production.vars]
ENVIRONMENT = "production"
